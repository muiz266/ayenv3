<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00B14F">
    <title>Sistem Eksekutif & Slot Pintar | Ayen Express</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --grab-green: #00B14F;
            --grab-green-dark: #008038;
            --grab-green-light: #e6f9ef;
            --whatsapp-green: #25D366;
            --white: #ffffff;
            --bg: #f8fafc;
            --bg-alt: #f1f5f9;
            --card: #ffffff;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text-dark: #0f172a;
            --text-body: #334155;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-glow: 0 6px 20px rgba(0, 177, 79, 0.25);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-pill: 50px;
            --font: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body.dark-mode {
            --bg: #121820;
            --bg-alt: #1a222d;
            --card: #18202b;
            --border: #273444;
            --border-light: #1f2937;
            --text-dark: #f1f5f9;
            --text-body: #cbd5e1;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --grab-green-light: #132e22;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: var(--font); 
            background: var(--bg); 
            color: var(--text-body); 
            line-height: 1.6; 
            min-height: 100vh; 
            padding-bottom: 140px; 
            position: relative;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .btn-clicked-effect {
            animation: btnPulseWave 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
        }
        @keyframes btnPulseWave {
            0% { transform: scale(1); }
            50% { transform: scale(0.88); filter: brightness(1.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        .cart-pulse-animation {
            animation: cartBounceEffect 0.4s ease-in-out !important;
        }
        @keyframes cartBounceEffect {
            0% { transform: scale(1); }
            30% { transform: scale(1.2) rotate(5deg); background-color: var(--grab-green); color: white; }
            60% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1); }
        }
        
        .status-bar { 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            background: var(--grab-green); 
            padding: 12px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
        }
        .status-left { display: flex; align-items: center; gap: 10px; }
        .status-indicator { width: 9px; height: 9px; border-radius: 50%; background: #ffffff; animation: statusPulse 2s ease-in-out infinite; }
        @keyframes statusPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }
        .status-text { color: #ffffff; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }

        .status-right-group { display: flex; align-items: center; gap: 8px; }
        
        .sidebar-toggle-btn, .dark-mode-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sidebar-toggle-btn:hover, .dark-mode-btn:hover { background: rgba(255, 255, 255, 0.35); transform: translateY(-1px); }
        .sidebar-toggle-btn svg, .dark-mode-btn svg { width: 13px; height: 13px; fill: white; }

        .earnings-header { background: var(--white); padding: 22px 20px; border-bottom: 1px solid var(--border); transition: background 0.3s ease, border-color 0.3s ease; }
        .earnings-top { display: flex; justify-content: space-between; align-items: center; }
        .earnings-greeting { font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .earnings-title { font-size: 20px; font-weight: 900; color: var(--text-dark); margin-top: 2px; }
        .earnings-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--grab-green-light); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: var(--grab-green); border: 2px solid var(--grab-green); }
        
        .main-content { max-width: 520px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }
        
        .flash-sale-banner { 
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); 
            border: 1px solid #fcd34d; 
            border-radius: var(--radius-md); 
            padding: 12px 16px; 
            margin-bottom: 14px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px; 
            font-weight: 800; 
            color: #92400e; 
            box-shadow: var(--shadow-sm);
        }
        body.dark-mode .flash-sale-banner {
            background: linear-gradient(135deg, #2d2613 100%, #3d3215 0%);
            border-color: #854d0e;
            color: #fde047;
        }
        .countdown-timer { background: #92400e; color: #fff; padding: 4px 10px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 900; letter-spacing: 0.5px; }
        body.dark-mode .countdown-timer { background: #ca8a04; color: #1a222d; }

        .promo-banner { 
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); 
            border: 1px solid #bbf7d0; 
            border-radius: var(--radius-md); 
            padding: 14px 16px; 
            margin-bottom: 16px; 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            box-shadow: var(--shadow-sm);
        }
        body.dark-mode .promo-banner {
            background: linear-gradient(135deg, #132e22 0%, #163828 100%);
            border-color: #166534;
        }
        .promo-banner svg { width: 22px; height: 22px; fill: var(--grab-green); flex-shrink: 0; margin-top: 1px; }
        .promo-text { font-size: 12px; font-weight: 700; color: #166534; line-height: 1.5; }
        body.dark-mode .promo-text { color: #86efac; }

        .progress-steps { display: flex; justify-content: space-between; margin-bottom: 16px; background: var(--card); padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: background 0.3s ease, border-color 0.3s ease; }
        .step-item { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; color: var(--text-muted); transition: 0.2s; }
        .step-item.active { color: var(--grab-green); }
        .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--border); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; }
        .step-item.active .step-num { background: var(--grab-green); color: white; }

        .card { background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); transition: background 0.3s ease, border-color 0.3s ease; }
        .section-title { font-size: 12px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

        .product-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
        .product-option { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--bg-alt); border: 2px solid var(--border); border-radius: var(--radius-md); transition: all 0.2s ease; gap: 12px; }
        .product-option:hover { border-color: var(--grab-green); background: var(--card); box-shadow: var(--shadow-sm); }
        .product-info h4 { font-size: 14px; font-weight: 800; color: var(--text-dark); }
        .product-info p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .product-price { font-size: 15px; font-weight: 900; color: var(--grab-green); white-space: nowrap; }
        
        .qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--grab-green); background: var(--card); color: var(--grab-green); font-size: 14px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .qty-btn:hover { background: var(--grab-green); color: var(--white); transform: scale(1.05); box-shadow: 0 2px 6px rgba(0,177,79,0.3); }
        .qty-display { font-size: 14px; font-weight: 900; min-width: 20px; text-align: center; color: var(--text-dark); }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 800; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-label .required-star { color: var(--danger); margin-left: 2px; }
        .form-input { width: 100%; padding: 12px 16px; background: var(--bg-alt); border: 2px solid var(--border); border-radius: var(--radius-md); font-family: var(--font); font-size: 14px; font-weight: 700; color: var(--text-dark); transition: all 0.2s; }
        .form-input::placeholder { color: var(--text-muted); opacity: 0.8; }
        .form-input:focus { outline: none; border-color: var(--grab-green); background: var(--card); box-shadow: 0 0 0 3px rgba(0,177,79,0.1); }
        
        .slot-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 16px; }
        .slot-option { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--bg-alt); border: 2px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.2s; color: var(--text-body); }
        .slot-option input[type="radio"] { accent-color: var(--grab-green); }
        .slot-option.selected { border-color: var(--grab-green); background: var(--grab-green-light); color: var(--grab-green); box-shadow: var(--shadow-sm); }
        .slot-option.full { opacity: 0.5; background: #fee2e2; border-color: #fca5a5; cursor: not-allowed; }
        body.dark-mode .slot-option.full { background: #3f1d1d; border-color: #7f1d1d; color: #fca5a5; }

        .payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .payment-option { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--bg-alt); border: 2px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; font-weight: 800; transition: all 0.2s; color: var(--text-dark); }
        .payment-option input[type="radio"] { accent-color: var(--grab-green); }
        .payment-option.selected { border-color: var(--grab-green); background: var(--grab-green-light); color: var(--grab-green); box-shadow: var(--shadow-sm); }

        .qr-instruction-box { background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px; text-align: center; }
        .qr-title { font-size: 13px; font-weight: 800; color: var(--text-dark); margin-bottom: 4px; }
        .qr-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.4; }
        .account-copy-box { display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; background: #e0f2fe; padding: 8px 16px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 800; color: #0369a1; cursor: pointer; border: 1px solid #bae6fd; width: 100%; transition: 0.2s; }
        body.dark-mode .account-copy-box { background: #082f49; color: #38bdf8; border-color: #0369a1; }
        .account-copy-box:hover { opacity: 0.9; }

        .checkout-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); padding: 16px 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; z-index: 500; border-top: 1px solid var(--border); transition: background 0.3s ease, border-color 0.3s ease; }
        
        .checkout-left-group { display: flex; align-items: center; gap: 14px; }
        
        .checkout-info div span { font-size: 10px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: block; }
        .checkout-info div h3 { font-size: 17px; font-weight: 900; color: var(--text-dark); margin-top: 1px; }

        .cart-bar-btn {
            background: var(--grab-green-light);
            border: 2px solid var(--grab-green);
            color: var(--grab-green);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .cart-bar-btn:hover { background: var(--grab-green); color: white; transform: scale(1.05); }
        .cart-bar-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .cart-bar-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 900;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--card);
        }
        
        .checkout-btn { background: linear-gradient(135deg, #00B14F 0%, #008038 100%); color: #ffffff; border: none; padding: 13px 24px; border-radius: var(--radius-md); font-family: var(--font); font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow-glow); transition: all 0.2s; }
        .checkout-btn:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,177,79,0.35); }
        
        .clear-cart-btn {
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fca5a5;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        body.dark-mode .clear-cart-btn { background: #3f1d1d; border-color: #7f1d1d; color: #fca5a5; }
        .clear-cart-btn:hover { opacity: 0.85; }

        .wa-floating-btn {
            position: fixed;
            bottom: 92px;
            right: 20px;
            width: 46px;
            height: 46px;
            background: var(--whatsapp-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            z-index: 450;
            transition: transform 0.2s;
        }
        .wa-floating-btn:hover { transform: scale(1.1); }
        .wa-floating-btn svg { width: 26px; height: 26px; fill: white; }

        .action-btn-sm { background: var(--grab-green-light); color: var(--grab-green); border: 1px solid var(--grab-green); padding: 10px 16px; border-radius: var(--radius-sm); font-family: var(--font); font-size: 12px; font-weight: 800; cursor: pointer; display: inline-block; transition: 0.2s; text-align: center; }
        .action-btn-sm:hover { background: var(--grab-green); color: var(--white); }

        .result-msg { margin-top: 12px; font-weight: 800; text-align: center; font-size: 13px; line-height: 1.5; }

        .toast-container {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #1e293b;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast-container.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .toast-icon { width: 18px; height: 18px; flex-shrink: 0; }
        .toast-container.success .toast-icon { fill: #4ade80; }
        .toast-container.error .toast-icon { fill: #f87171; }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
            z-index: 1500;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background: var(--card);
            z-index: 1600;
            box-shadow: 5px 0 25px rgba(0,0,0,0.15);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .sidebar-drawer.open {
            left: 0;
        }
        .sidebar-header {
            background: var(--grab-green);
            padding: 20px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-title {
            font-size: 16px;
            font-weight: 900;
        }
        .sidebar-close {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
        }
        .sidebar-body {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
        }
        .sidebar-menu-item {
            display: flex;
            align-items: center;
            ga
